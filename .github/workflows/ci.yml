name: CI Pipeline

"on":
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Environment Info
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          date

      - name: Build Project
        run: |
          echo "Starting build..."
          mkdir -p dist
          cp index.html dist/
          cp style.css dist/

      - name: Run Tests
        run: |
          chmod +x tests/test.sh
          ./tests/test.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: dist

      - name: Slack Success Notification
        if: success()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"BUILD SUCCESS: GitHub Actions CI pipeline completed successfully."}' \
          "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Slack Failure Notification
        if: failure()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"BUILD FAILURE: GitHub Actions CI pipeline failed."}' \
          "${{ secrets.SLACK_WEBHOOK_URL }}"